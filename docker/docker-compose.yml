services:
  # 1. Your Custom NLP Inference Engine
  egis-app:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: egis-inference-engine
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=egis-redis
      - REDIS_PORT=6379
      - REDIS_SESSION_TTL_SECONDS=604800
      - ALERT_COOLDOWN_SECONDS=300
      - RISK_ALERT_THRESHOLD=8
      - AGENT_ENABLED=true
      - GRAY_ZONE_MIN=4
      - GRAY_ZONE_MAX=7
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=AegisSecretKey2026
      - EVOLUTION_INSTANCE=test-user
      - EVOLUTION_ALERT_NUMBER=918117945755
      - EVOLUTION_ALERTS_ENABLED=true
    volumes:
      - ..:/app # Hot-reloads your local app.py changes instantly without rebuilding
    depends_on:
      - egis-redis

  # 5. Gray-zone agent worker (Cursor SDK + MCP) — auto-starts with compose
  egis-agent:
    build:
      context: ..
      dockerfile: docker/agent.dockerfile
    container_name: egis-agent-worker
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=egis-redis
      - EGIS_API_URL=http://egis-app:8000
      - MCP_PYTHON=/usr/local/bin/python
      - MCP_SERVER=/app/mcp_server.py
    volumes:
      - ../agent_worker.py:/app/agent_worker.py
      - ../agent_config.py:/app/agent_config.py
      - ../mcp_server.py:/app/mcp_server.py
    depends_on:
      - egis-app
      - egis-redis
    restart: unless-stopped

  # 2. The Evolution API Gateway (official image: evoapicloud/evolution-api)
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api-gateway
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=AegisSecretKey2026
      - SERVER_URL=http://localhost:8080
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:AegisSecretKey2026@evolution-postgres:5432/evolution_db?schema=evolution_api
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://egis-redis:6379
      - WEBHOOK_GLOBAL_ENABLED=true
      # Inside Docker Compose, containers talk to each other using their service names!
      - WEBHOOK_GLOBAL_URL=http://egis-app:8000/v1/webhook/whatsapp
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - egis-app
      - egis-redis
      - evolution-postgres

  # 3. State Memory Cache (Redis) — shared by egis-app and evolution-api
  egis-redis:
    image: redis:7-alpine
    container_name: egis-state-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 4. Evolution API database (required for v2)
  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    environment:
      POSTGRES_DB: evolution_db
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: AegisSecretKey2026
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

volumes:
  evolution_instances:
  evolution_postgres_data:
  redis_data:
